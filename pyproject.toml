[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ire-search-engine"
version = "2.0.0"
description = "Information Retrieval Engine with pluggable scoring, storage, and compression strategies"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

dependencies = [
    "nltk>=3.8",
    "pandas>=2.0",
    "pyarrow>=12.0",
    "psutil>=5.9",
    "numpy>=1.24",
]

[project.optional-dependencies]
semantic = [
    "chromadb>=0.4",
    "sentence-transformers>=2.2",
    "markitdown>=0.0.1",
    "pymupdf4llm>=0.0.5",
]
ui = [
    "chromadb>=0.4",
    "sentence-transformers>=2.2",
    "markitdown>=0.0.1",
    "pymupdf4llm>=0.0.5",
    "streamlit>=1.28",
]
plots = ["matplotlib>=3.7"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
all = [
    "matplotlib>=3.7",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "chromadb>=0.4",
    "sentence-transformers>=2.2",
    "markitdown>=0.0.1",
    "pymupdf4llm>=0.0.5",
    "streamlit>=1.28",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/ire_search"]

[tool.coverage.report]
show_missing = true
skip_empty = true
